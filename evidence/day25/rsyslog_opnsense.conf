module(load="imudp")
input(type="imudp" port="514" ruleset="opnsense")

# Al-Rafidah OT firewall logs - rule order = priority (like ELSIF)
ruleset(name="opnsense") {
    # 0) only accept the OT firewall
    if $fromhost-ip != '192.168.56.10' then {
        stop
    }
    # 1) traffic log: specific rule first
    if $programname == 'filterlog' then {
        action(type="omfile" file="/var/log/opnsense/filter.log" fileCreateMode="0640")
        stop
    }
    # 2) everything else: audit, devd, ntpd, configd
    action(type="omfile" file="/var/log/opnsense/system.log" fileCreateMode="0640")
}

